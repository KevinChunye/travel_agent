[project]
name = "travel-agent"
version = "0.1.0"
description = "Personal travel-booking agent: deterministic search/ranking/booking core driven by an OpenClaw skill."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
