[project]
name = "travel-agent"
version = "0.2.0"
description = "Personal flight search and price-monitoring agent: deterministic core driven by an OpenClaw skill over WhatsApp."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
